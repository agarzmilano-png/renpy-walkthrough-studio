name: Windows portable build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and inspect repository
        run: |
          python -B -m unittest discover -s tests
          python scripts/check_repository.py
      - name: Build portable ZIP with license notices
        run: python scripts/build_windows.py
      - name: Frozen CLI smoke test
        run: python scripts/smoke_windows.py --cli-only
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
