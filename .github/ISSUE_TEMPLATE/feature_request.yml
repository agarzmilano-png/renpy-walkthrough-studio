name: Feature request
description: Suggest a scoped improvement without uploading game files.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Problem and proposed improvement
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Accuracy, safety and compatibility considerations
      description: Explain how the change preserves unknown effects and source/backups.
